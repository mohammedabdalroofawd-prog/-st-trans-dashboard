<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST Trans — Shipment Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1D3A;--navy2:#1A3461;--navy3:#243E70;
  --accent:#F5A623;--accent2:#E8903A;
  --blue:#2E6FD9;--blue2:#4A8FEF;--blue-light:#EAF2FF;
  --green:#1A9E6A;--green-light:#E3F8F0;
  --teal:#0D8A72;--teal-light:#E0F5F0;
  --red:#D94040;--red-light:#FDEAEA;
  --purple:#7C3AED;--purple-light:#EDE9FE;
  --amber:#D97706;--amber-light:#FEF3C7;
  --bg:#F0F4FA;--surface:#FFFFFF;--surface2:#F7F9FC;
  --text:#0B1D3A;--text2:#455A7A;--text3:#8FA3BE;
  --border:#DDE5F0;--r:12px;--rlg:16px;
}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* TOP BAR */
.topbar{height:60px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:200}
.tlogo{display:flex;align-items:center;gap:12px}
.tlogo-box{width:38px;height:38px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center}
.tlogo-box i{font-size:20px;color:var(--navy)}
.tlogo-text{color:#fff;font-size:15px;font-weight:700;letter-spacing:.01em}
.tlogo-sub{color:#7A9CC8;font-size:11px;margin-top:1px}
.tnav{display:flex;gap:2px}
.tnav-btn{padding:8px 18px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:#7A9CC8;transition:all .15s;display:flex;align-items:center;gap:6px}
.tnav-btn.active{background:rgba(255,255,255,.15);color:#fff}
.tnav-btn:hover:not(.active){background:rgba(255,255,255,.08);color:#ccc}

/* PAGE */
.page{max-width:1100px;margin:0 auto;padding:24px 20px}

/* HERO STATS ROW */
.hero-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.hcard{border-radius:var(--rlg);padding:18px 16px;position:relative;overflow:hidden;cursor:default}
.hcard-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.75;margin-bottom:6px}
.hcard-val{font-size:32px;font-weight:800;line-height:1}
.hcard-sub{font-size:12px;margin-top:6px;opacity:.7}
.hcard-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:44px;opacity:.15}
.hcard-blue{background:linear-gradient(135deg,#1A3F8F,#2E6FD9);color:#fff}
.hcard-green{background:linear-gradient(135deg,#0D6E4A,#1A9E6A);color:#fff}
.hcard-teal{background:linear-gradient(135deg,#085C4D,#0D8A72);color:#fff}
.hcard-red{background:linear-gradient(135deg,#9B1F1F,#D94040);color:#fff}
.hcard-amber{background:linear-gradient(135deg,#92510A,#D97706);color:#fff}

/* CHARTS ROW */
.charts-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:24px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);padding:18px 20px}
.chart-card.wide{grid-column:span 2}
.chart-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.chart-title i{font-size:16px;color:var(--blue)}
.chart-wrap{position:relative;height:180px}

/* ROUTE TABLE */
.route-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);padding:18px 20px;margin-bottom:24px}
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable th{text-align:left;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:0 12px 10px 0;border-bottom:1px solid var(--border)}
.rtable td{padding:10px 12px 10px 0;border-bottom:1px solid var(--border);color:var(--text2)}
.rtable tr:last-child td{border-bottom:none}
.rtable td:first-child{font-weight:600;color:var(--text)}
.rbar-wrap{background:var(--bg);border-radius:20px;height:7px;width:120px;overflow:hidden}
.rbar{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--blue2))}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--blue)}
.toolbar input{flex:1;min-width:160px}
.toolbar select{min-width:130px}

/* SECTION HDR */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-hdr h2{font-size:14px;font-weight:600;color:var(--text2)}
.count-pill{background:var(--blue-light);color:var(--blue);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px}

/* CARDS */
.truck-grid{display:flex;flex-direction:column;gap:8px}
.truck-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);padding:14px 18px;display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;transition:box-shadow .15s,border-color .15s}
.truck-card:hover{box-shadow:0 3px 16px rgba(11,29,58,.08);border-color:#C5D4E8}
.cicon{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.truck-id{font-size:15px;font-weight:700;color:var(--text)}
.truck-route{font-size:12px;color:var(--text2);margin:3px 0}
.truck-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px}
.mi{font-size:12px;color:var(--text3)}
.mi b{color:var(--text2);font-weight:500}
.badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;white-space:nowrap;letter-spacing:.02em}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:6px;transition:color .15s}
.del-btn:hover{color:var(--red)}
.empty{text-align:center;padding:48px;color:var(--text3)}
.empty i{font-size:48px;display:block;margin-bottom:12px;opacity:.3}

/* STATUS COLORS */
.s-loading{background:#EAF2FF;color:#1A4FAA}
.s-transit{background:var(--green-light);color:#0A5E3F}
.s-delivered{background:var(--teal-light);color:#085C4D}
.s-delayed{background:var(--red-light);color:#9B1F1F}
.s-waiting{background:var(--amber-light);color:#7C4508}
.ic-loading{background:#EAF2FF}.ic-loading i{color:#2E6FD9}
.ic-transit{background:var(--green-light)}.ic-transit i{color:#1A9E6A}
.ic-delivered{background:var(--teal-light)}.ic-delivered i{color:#0D8A72}
.ic-delayed{background:var(--red-light)}.ic-delayed i{color:#D94040}
.ic-waiting{background:var(--amber-light)}.ic-waiting i{color:#D97706}

/* FORM */
.form-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);padding:24px}
.form-intro{font-size:13px;color:var(--text2);margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg.full{grid-column:1/-1}
.fg label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select,.fg textarea{font-size:13px;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--text);outline:none;font-family:inherit;width:100%;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue);background:#fff}
.save-btn{margin-top:12px;background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;border:none;padding:12px 28px;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:opacity .15s}
.save-btn:hover{opacity:.9}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:var(--r);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1}

/* MOBILE */
.mobtabs{display:none;gap:4px;margin-bottom:16px}
.mobtab{flex:1;padding:10px;text-align:center;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.mobtab.active{background:var(--navy);color:#fff;border-color:var(--navy)}

@media(max-width:900px){.charts-row{grid-template-columns:1fr 1fr}.chart-card.wide{grid-column:1/-1}}
@media(max-width:640px){
  .hero-row{grid-template-columns:repeat(2,1fr)}
  .hero-row .hcard:last-child{grid-column:1/-1}
  .charts-row{grid-template-columns:1fr}
  .chart-card.wide{grid-column:1}
  .form-grid{grid-template-columns:1fr}.fg.full{grid-column:1}
  .truck-card{grid-template-columns:40px 1fr}
  .cright{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .tnav{display:none}.mobtabs{display:flex}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tlogo">
    <div class="tlogo-box"><i class="ti ti-truck"></i></div>
    <div>
      <div class="tlogo-text">ST Trans</div>
      <div class="tlogo-sub">Shipment Tracker — SAYGA June 2026</div>
    </div>
  </div>
  <div class="tnav">
    <button class="tnav-btn active" onclick="switchTab('dashboard')"><i class="ti ti-layout-dashboard"></i> Dashboard</button>
    <button class="tnav-btn" onclick="switchTab('tracker')"><i class="ti ti-list"></i> Shipments</button>
    <button class="tnav-btn" onclick="switchTab('upload')"><i class="ti ti-plus"></i> Add Entry</button>
  </div>
</div>

<div class="page">
  <div class="mobtabs">
    <button class="mobtab active" onclick="switchTab('dashboard')"><i class="ti ti-layout-dashboard"></i> Dashboard</button>
    <button class="mobtab" onclick="switchTab('tracker')"><i class="ti ti-list"></i> Shipments</button>
    <button class="mobtab" onclick="switchTab('upload')"><i class="ti ti-plus"></i> Add</button>
  </div>

  <!-- DASHBOARD TAB -->
  <div id="view-dashboard">
    <div class="hero-row" id="hero-row"></div>
    <div class="charts-row">
      <div class="chart-card wide">
        <div class="chart-title"><i class="ti ti-chart-bar"></i> Daily Trips by Date</div>
        <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title"><i class="ti ti-chart-donut"></i> Status Breakdown</div>
        <div class="chart-wrap"><canvas id="chart-status"></canvas></div>
      </div>
    </div>
    <div class="route-table-wrap">
      <div class="chart-title" style="margin-bottom:16px"><i class="ti ti-map-route"></i> Route Performance</div>
      <table class="rtable" id="route-table">
        <thead><tr><th>Route</th><th>Trips</th><th>Total Weight (MT)</th><th>Avg Weight</th><th>Share</th></tr></thead>
        <tbody id="route-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- SHIPMENTS TAB -->
  <div id="view-tracker" style="display:none">
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Search truck ID, driver, manifest..." oninput="renderCards()">
      <select id="filter-status" onchange="renderCards()">
        <option value="">All statuses</option>
        <option>Loading</option><option>In Transit</option>
        <option>Delivered</option><option>Delayed</option><option>Waiting</option>
      </select>
      <select id="filter-route" onchange="renderCards()">
        <option value="">All routes</option>
      </select>
      <select id="filter-date" onchange="renderCards()">
        <option value="">All dates</option>
      </select>
    </div>
    <div class="sec-hdr">
      <h2>Shipment Records</h2>
      <span class="count-pill" id="count-pill">0</span>
    </div>
    <div class="truck-grid" id="truck-grid"></div>
  </div>

  <!-- ADD ENTRY TAB -->
  <div id="view-upload" style="display:none">
    <div class="form-wrap">
      <p class="form-intro">Add or update a truck shipment. Fields marked <b>*</b> are required.</p>
      <div class="form-grid">
        <div class="fg"><label>Truck ID *</label><input id="f-id" placeholder="e.g. 9044"></div>
        <div class="fg"><label>Driver Name *</label><input id="f-driver" placeholder="Full name"></div>
        <div class="fg"><label>Origin *</label><input id="f-origin" placeholder="e.g. Port Sudan" value="PZU"></div>
        <div class="fg"><label>Destination *</label><input id="f-dest" placeholder="e.g. Khartoum"></div>
        <div class="fg"><label>Cargo Type</label><input id="f-cargo" placeholder="e.g. WHEATRW01" value="WHEATRW01"></div>
        <div class="fg"><label>Weight (MT)</label><input id="f-weight" type="number" placeholder="e.g. 90.5"></div>
        <div class="fg"><label>Client</label><input id="f-client" placeholder="e.g. SAYGA" value="SAYGA"></div>
        <div class="fg"><label>Status *</label>
          <select id="f-status">
            <option>Loading</option><option>In Transit</option>
            <option selected>Delivered</option><option>Delayed</option><option>Waiting</option>
          </select>
        </div>
        <div class="fg"><label>Departure Date</label><input id="f-dep" type="date"></div>
        <div class="fg"><label>Manifest No</label><input id="f-manifest" placeholder="e.g. 010254"></div>
        <div class="fg full"><label>Notes</label><textarea id="f-notes" rows="2" placeholder="Any remarks..."></textarea></div>
      </div>
      <button class="save-btn" onclick="submitEntry()"><i class="ti ti-device-floppy"></i> Save Shipment</button>
    </div>
  </div>
</div>

<div id="toast"><i class="ti ti-check"></i> <span id="toast-msg"></span></div>

let shipments = [];
let charts = {};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    shipments = s && s.length ? s : JSON.parse(JSON.stringify(SEED));
  } catch(e) { shipments = JSON.parse(JSON.stringify(SEED)); }
  renderAll();
}

function save() { localStorage.setItem(STORE, JSON.stringify(shipments)); }

const SC = {
  'Loading':   {cls:'loading',   ic:'ti-package',      grad:['#1A3F8F','#2E6FD9']},
  'In Transit':{cls:'transit',   ic:'ti-truck',        grad:['#0D6E4A','#1A9E6A']},
  'Delivered': {cls:'delivered', ic:'ti-circle-check', grad:['#085C4D','#0D8A72']},
  'Delayed':   {cls:'delayed',   ic:'ti-alert-circle', grad:['#9B1F1F','#D94040']},
  'Waiting':   {cls:'waiting',   ic:'ti-clock',        grad:['#92510A','#D97706']},
};

/* ---- HERO KPIs ---- */
function renderHero() {
  const t = shipments.length;
  const tr = shipments.filter(x=>x.status==='In Transit').length;
  const d = shipments.filter(x=>x.status==='Delivered').length;
  const del = shipments.filter(x=>x.status==='Delayed').length;
  const tw = shipments.reduce((s,x)=>s+(x.weight||0),0);
  document.getElementById('hero-row').innerHTML = `
    <div class="hcard hcard-blue"><div class="hcard-label">Total Trips</div><div class="hcard-val">${t}</div><div class="hcard-sub">June 2026</div><i class="ti ti-truck hcard-icon"></i></div>
    <div class="hcard hcard-green"><div class="hcard-label">In Transit</div><div class="hcard-val">${tr}</div><div class="hcard-sub">Currently moving</div><i class="ti ti-road hcard-icon"></i></div>
    <div class="hcard hcard-teal"><div class="hcard-label">Delivered</div><div class="hcard-val">${d}</div><div class="hcard-sub">${t?Math.round(d/t*100):0}% success rate</div><i class="ti ti-circle-check hcard-icon"></i></div>
    <div class="hcard hcard-red"><div class="hcard-label">Delayed</div><div class="hcard-val">${del}</div><div class="hcard-sub">Requires attention</div><i class="ti ti-alert-circle hcard-icon"></i></div>
    <div class="hcard hcard-amber"><div class="hcard-label">Total Weight</div><div class="hcard-val" style="font-size:26px">${(tw/1000).toFixed(1)}K</div><div class="hcard-sub">Metric tons loaded</div><i class="ti ti-weight hcard-icon"></i></div>
  `;
}

/* ---- DAILY CHART ---- */
function renderDailyChart() {
  const byDate = {};
  shipments.forEach(x => { if(x.dep) byDate[x.dep]=(byDate[x.dep]||0)+1; });
  const labels = Object.keys(byDate).sort();
  const vals = labels.map(d=>byDate[d]);
  const ctx = document.getElementById('chart-daily').getContext('2d');
  if(charts.daily) charts.daily.destroy();
  charts.daily = new Chart(ctx,{
    type:'bar',
    data:{labels:labels.map(d=>d.slice(5)),datasets:[{
      label:'Trips',data:vals,
      backgroundColor:'rgba(46,111,217,0.75)',
      borderColor:'#2E6FD9',borderWidth:1.5,
      borderRadius:6,borderSkipped:false
    }]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:t=>'Date: 2026-'+t[0].label}}},scales:{x:{grid:{display:false},ticks:{color:'#8FA3BE',font:{size:11}}},y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#8FA3BE',font:{size:11}},beginAtZero:true}}}
  });
}

/* ---- STATUS DONUT ---- */
function renderStatusChart() {
  const counts = ['Delivered','In Transit','Loading','Delayed','Waiting'].map(s=>shipments.filter(x=>x.status===s).length);
  const ctx = document.getElementById('chart-status').getContext('2d');
  if(charts.status) charts.status.destroy();
  charts.status = new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['Delivered','In Transit','Loading','Delayed','Waiting'],
      datasets:[{data:counts,backgroundColor:['#0D8A72','#1A9E6A','#2E6FD9','#D94040','#D97706'],borderWidth:2,borderColor:'#fff',hoverOffset:4}]
    },
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'bottom',labels:{font:{size:11},color:'#455A7A',boxWidth:10,padding:10}}}}
  });
}

/* ---- ROUTE TABLE ---- */
function renderRouteTable() {
  const routes = {};
  shipments.forEach(x=>{
    const k = x.origin+' → '+x.dest;
    if(!routes[k]) routes[k]={trips:0,weight:0};
    routes[k].trips++;
    routes[k].weight+=x.weight||0;
  });
  const total = shipments.length;
  const sorted = Object.entries(routes).sort((a,b)=>b[1].trips-a[1].trips);
  const maxT = sorted[0]?.[1]?.trips||1;
  document.getElementById('route-tbody').innerHTML = sorted.map(([r,v])=>`
    <tr>
      <td>${r}</td>
      <td><b>${v.trips}</b></td>
      <td>${v.weight.toFixed(1)}</td>
      <td>${(v.weight/v.trips).toFixed(2)}</td>
      <td><div class="rbar-wrap"><div class="rbar" style="width:${Math.round(v.trips/maxT*100)}%"></div></div></td>
    </tr>`).join('');
}

/* ---- FILTERS ---- */
function renderFilters() {
  const routes = [...new Set(shipments.map(x=>x.origin+' → '+x.dest))].sort();
  const dates = [...new Set(shipments.map(x=>x.dep).filter(Boolean))].sort().reverse();
  const rs=document.getElementById('filter-route'),cv=rs.value;
  rs.innerHTML='<option value="">All routes</option>'+routes.map(r=>`<option ${cv===r?'selected':''}>${r}</option>`).join('');
  const ds=document.getElementById('filter-date'),cd=ds.value;
  ds.innerHTML='<option value="">All dates</option>'+dates.map(d=>`<option ${cd===d?'selected':''}>${d}</option>`).join('');
}

/* ---- CARDS ---- */
function renderCards() {
  const q=(document.getElementById('search-input').value||'').toLowerCase();
  const fs=document.getElementById('filter-status').value;
  const fr=document.getElementById('filter-route').value;
  const fd=document.getElementById('filter-date').value;
  let list=shipments.filter(x=>{
    if(fs&&x.status!==fs)return false;
    if(fr&&x.origin+' → '+x.dest!==fr)return false;
    if(fd&&x.dep!==fd)return false;
    if(q&&!(x.id.toLowerCase().includes(q)||x.driver.toLowerCase().includes(q)||x.origin.toLowerCase().includes(q)||x.dest.toLowerCase().includes(q)||(x.manifest||'').toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>b.ts-a.ts);
  document.getElementById('count-pill').textContent=list.length;
  const g=document.getElementById('truck-grid');
  if(!list.length){g.innerHTML='<div class="empty"><i class="ti ti-truck-off"></i><p>No shipments match</p></div>';return;}
  g.innerHTML=list.map(x=>{
    const c=SC[x.status]||SC['Delivered'];
    return `<div class="truck-card">
      <div class="cicon ic-${c.cls}"><i class="ti ${c.ic}" style="font-size:20px"></i></div>
      <div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="truck-id">Truck #${x.id}</span>
          <span class="badge s-${c.cls}">${x.status}</span>
          ${x.manifest&&x.manifest!=='Abo Hamad Route'?`<span style="font-size:11px;color:var(--text3);background:var(--bg);padding:2px 8px;border-radius:20px">Manifest: ${x.manifest}</span>`:''}
        </div>
        <div class="truck-route"><i class="ti ti-user" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>${x.driver}&nbsp;·&nbsp;<i class="ti ti-map-pin" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>${x.origin} → ${x.dest}</div>
        <div class="truck-meta">
          ${x.cargo?`<span class="mi"><b>Cargo:</b> ${x.cargo}</span>`:''}
          ${x.weight?`<span class="mi"><b>Weight:</b> ${x.weight} MT</span>`:''}
          ${x.client?`<span class="mi"><b>Client:</b> ${x.client}</span>`:''}
          ${x.dep?`<span class="mi"><b>Date:</b> ${x.dep}</span>`:''}
        </div>
      </div>
      <div class="cright">
        <button class="del-btn" onclick="delEntry('${x.id}',${x.ts})" title="Delete"><i class="ti ti-trash" style="font-size:16px"></i></button>
      </div>
    </div>`;
  }).join('');
}

function renderAll(){renderHero();renderDailyChart();renderStatusChart();renderRouteTable();renderFilters();renderCards();}

function switchTab(t){
  ['dashboard','tracker','upload'].forEach(v=>{
    document.getElementById('view-'+v).style.display=v===t?'':'none';
  });
  document.querySelectorAll('.tnav-btn,.mobtab').forEach(el=>{
    el.classList.toggle('active',el.textContent.trim().toLowerCase().includes(
      t==='dashboard'?'dash':t==='tracker'?'ship':t==='upload'?'add':t
    ));
  });
  if(t==='dashboard'){renderDailyChart();renderStatusChart();}
}

function toast(msg){
  document.getElementById('toast-msg').textContent=msg;
  const t=document.getElementById('toast');
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

function submitEntry(){
  const id=document.getElementById('f-id').value.trim();
  const driver=document.getElementById('f-driver').value.trim();
  const origin=document.getElementById('f-origin').value.trim();
  const dest=document.getElementById('f-dest').value.trim();
  if(!id||!driver||!origin||!dest){toast('Please fill required fields');return;}
  const entry={id,driver,origin,dest,
    status:document.getElementById('f-status').value,
    cargo:document.getElementById('f-cargo').value.trim(),
    weight:parseFloat(document.getElementById('f-weight').value)||0,
    client:document.getElementById('f-client').value.trim(),
    dep:document.getElementById('f-dep').value,
    manifest:document.getElementById('f-manifest').value.trim(),
    eta:'',notes:document.getElementById('f-notes').value.trim(),ts:Date.now()
  };
  const idx=shipments.findIndex(x=>x.id===id&&x.dep===entry.dep);
  if(idx>-1)shipments[idx]=entry;else shipments.push(entry);
  save();renderAll();
  ['f-id','f-driver','f-origin','f-dest','f-cargo','f-weight','f-manifest','f-notes'].forEach(f=>document.getElementById(f).value='');
  document.getElementById('f-dep').value='';
  document.getElementById('f-status').value='Delivered';
  toast('Shipment saved!');
  switchTab('dashboard');
}

function delEntry(id,ts){
  if(!confirm('Delete truck #'+id+'?'))return;
  shipments=shipments.filter(x=>!(x.id===id&&x.ts===ts));
  save();renderAll();toast('Deleted');
}

load();
</script>
